<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pong</title><style>:root{--a:#ff5cf7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b2140,#080910 60%);color:#f6f7ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;display:flex;flex-direction:column;align-items:center;padding:16px}.top{width:min(900px,100%);display:flex;justify-content:space-between;align-items:center;gap:10px}.menu{color:var(--a);text-decoration:none;font-weight:900}.hud{display:flex;gap:10px;flex-wrap:wrap}.pill,button{background:#151827;color:#fff;border:2px solid var(--a);border-radius:12px;padding:8px 12px;box-shadow:5px 5px 0 #000}canvas,.board{background:#111421;border:3px solid var(--a);border-radius:16px;box-shadow:10px 10px 0 #000;margin-top:14px;touch-action:none}.overlay{position:fixed;inset:0;background:#000b;display:none;place-items:center;text-align:center;padding:20px}.card{background:#151827;border:3px solid var(--a);border-radius:18px;padding:22px;box-shadow:10px 10px 0 #000}button{cursor:pointer;font:inherit}h1{color:var(--a);text-shadow:5px 5px #000}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style></head><body><div class=top><a class=menu href="index.html">‹ Menu</a><div class=hud><span class=pill>You <b id=ps>0</b></span><span class=pill>AI <b id=as>0</b></span></div></div><h1>PONG</h1><canvas id=c width=720 height=420></canvas><div class=overlay id=o><div class=card><h2 id=m></h2><button onclick="resetGame()">Restart</button></div></div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let p,a,ball,up=0,down=0,pscore=0,ascore=0,over=false;function resetBall(v=1){ball={x:360,y:210,vx:5*v,vy:(Math.random()*4-2),r:8,rally:0}}function resetGame(){p={y:170};a={y:170};pscore=ascore=0;ps.textContent=as.textContent=0;over=false;o.style.display='none';resetBall(Math.random()<.5?1:-1)}function move(e,v){if(['w','ArrowUp'].includes(e.key)){up=v;e.preventDefault()}if(['s','ArrowDown'].includes(e.key)){down=v;e.preventDefault()}}addEventListener('keydown',e=>move(e,1));addEventListener('keyup',e=>move(e,0));c.onpointermove=e=>{let r=c.getBoundingClientRect();p.y=(e.clientY-r.top)*420/r.height-40};function loop(){if(!over){p.y=Math.max(0,Math.min(340,p.y+(down-up)*7));a.y+=Math.sign(ball.y-(a.y+40))*4.2;a.y=Math.max(0,Math.min(340,a.y));ball.x+=ball.vx;ball.y+=ball.vy;if(ball.y<8||ball.y>412)ball.vy*=-1;hit(18,p,1);hit(690,a,-1);if(ball.x<0){ascore++;as.textContent=ascore;resetBall(1)}if(ball.x>720){pscore++;ps.textContent=pscore;resetBall(-1)}if(pscore>=7||ascore>=7){over=true;m.textContent=pscore>=7?'You win!':'AI wins!';o.style.display='grid'}}draw();requestAnimationFrame(loop)}function hit(px,pad,sgn){if(Math.abs(ball.x-px)<12&&ball.y>pad.y&&ball.y<pad.y+80){let rel=(ball.y-(pad.y+40))/40;ball.vx=sgn*(5+Math.min(5,++ball.rally*.25));ball.vy=rel*7}}function draw(){g.fillStyle='#111421';g.fillRect(0,0,720,420);g.strokeStyle='#ff5cf7';g.setLineDash([8,8]);g.beginPath();g.moveTo(360,0);g.lineTo(360,420);g.stroke();g.setLineDash([]);g.fillStyle='#fff';g.fillRect(10,p.y,12,80);g.fillRect(698,a.y,12,80);g.fillStyle='#ff5cf7';g.beginPath();g.arc(ball.x,ball.y,ball.r,0,7);g.fill()}resetGame();loop();</script></body></html>
