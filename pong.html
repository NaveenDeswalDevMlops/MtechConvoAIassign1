<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pong</title>
<style>:root{--a:#ff5cf7}*{box-sizing:border-box}html{height:100%}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 20% -10%,color-mix(in srgb,var(--a),transparent 78%),transparent 34%),radial-gradient(circle at 88% 8%,rgba(255,255,255,.10),transparent 28%),linear-gradient(180deg,#101018,#090909 70%);color:#f8fbff;font-family:system-ui,"Segoe UI","SF Pro Display",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:clamp(12px,3vw,24px)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle,#000 0%,transparent 78%);animation:grid 14s linear infinite}body:after{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.14) 0 1px,transparent 2px);background-size:82px 82px;animation:stars 20s linear infinite;opacity:.28}@keyframes grid{to{transform:translateY(44px)}}@keyframes stars{to{transform:translate3d(-82px,82px,0)}}.top{position:relative;z-index:2;width:min(920px,100%);display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}.menu{min-height:44px;display:inline-flex;align-items:center;color:var(--a);text-decoration:none;font-weight:900;border:1px solid color-mix(in srgb,var(--a),transparent 20%);border-radius:999px;background:rgba(255,255,255,.07);padding:10px 14px;box-shadow:5px 5px 0 #000,0 0 28px color-mix(in srgb,var(--a),transparent 78%)}.hud{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.pill,button{font:inherit;font-weight:800;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));color:#fff;border:1px solid color-mix(in srgb,var(--a),white 12%);border-radius:14px;padding:10px 14px;box-shadow:5px 5px 0 #000,0 0 24px color-mix(in srgb,var(--a),transparent 82%);backdrop-filter:blur(14px)}.pill b{font-variant-numeric:tabular-nums;color:var(--a)}button{cursor:pointer;min-height:44px;transition:transform .18s,box-shadow .18s,filter .18s}button:hover,button:focus-visible,.menu:hover,.menu:focus-visible{outline:2px solid var(--a);outline-offset:3px;transform:translate(-2px,-3px);filter:brightness(1.12)}button:active{transform:translate(1px,1px)}h1{position:relative;z-index:1;margin:10px 0 2px;color:var(--a);font-size:clamp(2.1rem,7vw,4.6rem);letter-spacing:-.07em;text-shadow:0 0 26px color-mix(in srgb,var(--a),transparent 45%),7px 7px 0 #000}canvas,.board{position:relative;z-index:1;max-width:min(94vw,920px);height:auto;background:linear-gradient(180deg,rgba(17,20,33,.92),rgba(9,10,18,.96));border:1px solid color-mix(in srgb,var(--a),white 10%);border-radius:22px;box-shadow:14px 14px 0 #000,0 0 55px color-mix(in srgb,var(--a),transparent 72%),inset 0 0 36px rgba(255,255,255,.04);margin-top:14px;touch-action:none}.overlay,.start{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.72);display:none;place-items:center;text-align:center;padding:20px;backdrop-filter:blur(10px)}.start{display:grid}.card{width:min(520px,92vw);background:linear-gradient(145deg,rgba(28,32,49,.86),rgba(12,14,24,.92));border:1px solid color-mix(in srgb,var(--a),white 15%);border-radius:24px;padding:28px;box-shadow:16px 16px 0 #000,0 0 70px color-mix(in srgb,var(--a),transparent 68%);animation:pop .42s cubic-bezier(.2,.9,.2,1)}.card p{color:#b9c0d8;line-height:1.55}.art{width:112px;height:112px;margin:0 auto 12px;border-radius:30px;background:radial-gradient(circle at 35% 30%,#fff8,transparent 20%),linear-gradient(135deg,var(--a),transparent);box-shadow:0 0 48px color-mix(in srgb,var(--a),transparent 35%);animation:float 3s ease-in-out infinite}.sound{position:fixed;right:16px;bottom:16px;z-index:4}.shake{animation:shake .22s}.flash{animation:flash .32s}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(18px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes flash{50%{filter:brightness(1.8)}}@media(max-width:640px){.top{align-items:flex-start}.hud{font-size:.86rem}.pill,button,.menu{padding:9px 11px}canvas{width:94vw}.board{transform-origin:top center;max-width:94vw}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style>
</head>
<body>
<div class="start" id="start">
<div class="card">
<div class="art" aria-hidden="true">
</div>
<h2>Pong</h2>
<p>Outplay a reactive AI in a first-to-seven neon duel.</p>
<p>
<strong>Controls:</strong> W/S, arrow keys, mouse, or touch move your paddle.</p>
<p>
<strong>Mode:</strong> Normal</p>
<button id="startBtn" type="button">Start Game</button>
</div>
</div>
<button class="sound" id="soundBtn" type="button" aria-label="Toggle sound">Sound On</button>
<div class=top>
<a class=menu href="index.html">‹ Menu</a>
<div class=hud>
<span class=pill>You <b id=ps>0</b>
</span>
<span class=pill>AI <b id=as>0</b>
</span>
</div>
</div>
<h1>PONG</h1>
<canvas id=c width=720 height=420>
</canvas>
<div class=overlay id=o>
<div class=card>
<h2 id=m>
</h2>
<button onclick="resetGame()">Restart</button>
</div>
</div>
<script>
// Premium shell: menu, generated UI sounds, and button feedback.
let __muted=false,__audio;function __beep(freq=440,dur=.06,type='sine'){if(__muted)return;__audio=__audio||new (window.AudioContext||window.webkitAudioContext)();const o=__audio.createOscillator(),gain=__audio.createGain();o.type=type;o.frequency.value=freq;gain.gain.setValueAtTime(.045,__audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,__audio.currentTime+dur);o.connect(gain);gain.connect(__audio.destination);o.start();o.stop(__audio.currentTime+dur)}addEventListener('click',e=>{if(e.target.closest('button,a'))__beep(520,.045,'triangle')},true);addEventListener('DOMContentLoaded',()=>{const st=document.getElementById('start'),sb=document.getElementById('startBtn'),snd=document.getElementById('soundBtn');if(sb)sb.onclick=()=>{__beep(760,.09,'square');st.style.display='none'};if(snd)snd.onclick=()=>{__muted=!__muted;snd.textContent=__muted?'Sound Off':'Sound On'}});

const c=document.getElementById('c'),g=c.getContext('2d');let p,a,ball,up=0,down=0,pscore=0,ascore=0,over=false;function resetBall(v=1){ball={x:360,y:210,vx:5*v,vy:(Math.random()*4-2),r:8,rally:0}}function resetGame(){p={y:170};a={y:170};pscore=ascore=0;ps.textContent=as.textContent=0;over=false;o.style.display='none';resetBall(Math.random()<.5?1:-1)}function move(e,v){if(['w','ArrowUp'].includes(e.key)){up=v;e.preventDefault()}if(['s','ArrowDown'].includes(e.key)){down=v;e.preventDefault()}}addEventListener('keydown',e=>move(e,1));addEventListener('keyup',e=>move(e,0));c.onpointermove=e=>{let r=c.getBoundingClientRect();p.y=(e.clientY-r.top)*420/r.height-40};function loop(){if(!over){p.y=Math.max(0,Math.min(340,p.y+(down-up)*7));a.y+=Math.sign(ball.y-(a.y+40))*4.2;a.y=Math.max(0,Math.min(340,a.y));ball.x+=ball.vx;ball.y+=ball.vy;if(ball.y<8||ball.y>412)ball.vy*=-1;hit(18,p,1);hit(690,a,-1);if(ball.x<0){ascore++;as.textContent=ascore;resetBall(1)}if(ball.x>720){pscore++;ps.textContent=pscore;resetBall(-1)}if(pscore>=7||ascore>=7){over=true;m.textContent=pscore>=7?'You win!':'AI wins!';o.style.display='grid'}}draw();requestAnimationFrame(loop)}function hit(px,pad,sgn){if(Math.abs(ball.x-px)<12&&ball.y>pad.y&&ball.y<pad.y+80){let rel=(ball.y-(pad.y+40))/40;ball.vx=sgn*(5+Math.min(5,++ball.rally*.25));ball.vy=rel*7}}function draw(){g.fillStyle='#111421';g.fillRect(0,0,720,420);g.strokeStyle='#ff5cf7';g.setLineDash([8,8]);g.beginPath();g.moveTo(360,0);g.lineTo(360,420);g.stroke();g.setLineDash([]);g.fillStyle='#fff';g.fillRect(10,p.y,12,80);g.fillRect(698,a.y,12,80);g.fillStyle='#ff5cf7';g.beginPath();g.arc(ball.x,ball.y,ball.r,0,7);g.fill()}resetGame();loop();</script>
</body>
</html>
