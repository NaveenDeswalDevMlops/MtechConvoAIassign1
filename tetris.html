<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tetris</title><style>:root{--a:#5cf2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b2140,#080910 60%);color:#f6f7ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;display:flex;flex-direction:column;align-items:center;padding:16px}.top{width:min(900px,100%);display:flex;justify-content:space-between;align-items:center;gap:10px}.menu{color:var(--a);text-decoration:none;font-weight:900}.hud{display:flex;gap:10px;flex-wrap:wrap}.pill,button{background:#151827;color:#fff;border:2px solid var(--a);border-radius:12px;padding:8px 12px;box-shadow:5px 5px 0 #000}canvas,.board{background:#111421;border:3px solid var(--a);border-radius:16px;box-shadow:10px 10px 0 #000;margin-top:14px;touch-action:none}.overlay{position:fixed;inset:0;background:#000b;display:none;place-items:center;text-align:center;padding:20px}.card{background:#151827;border:3px solid var(--a);border-radius:18px;padding:22px;box-shadow:10px 10px 0 #000}button{cursor:pointer;font:inherit}h1{color:var(--a);text-shadow:5px 5px #000}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}.wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:center}</style></head><body><div class=top><a class=menu href="index.html">‹ Menu</a><div class=hud><span class=pill>Score <b id=s>0</b></span><span class=pill>Lines <b id=ln>0</b></span><span class=pill>Level <b id=lv>1</b></span></div></div><h1>TETRIS</h1><div class=wrap><canvas id=c width=300 height=600></canvas><canvas id=n width=120 height=120></canvas></div><div class=overlay id=o><div class=card><h2>Game over</h2><button onclick="reset()">Restart</button></div></div><script>
const c=document.getElementById('c'),g=c.getContext('2d'),ng=n.getContext('2d'),W=10,H=20,Z=30;let B,bag,cur,next,score,lines,level,last=0,drop=800,over=false;const P={I:[[0,1],[1,1],[2,1],[3,1]],O:[[1,0],[2,0],[1,1],[2,1]],T:[[1,0],[0,1],[1,1],[2,1]],S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]]},C={I:'#5cf2ff',O:'#ffd84c',T:'#b66cff',S:'#65ff65',Z:'#ff6b8b',J:'#4d7cff',L:'#ff9b4c'};function take(){if(!bag.length)bag=Object.keys(P).sort(()=>Math.random()-.5);let t=bag.pop();return{t,x:3,y:0,r:0,pts:P[t].map(p=>[...p])}}function reset(){B=Array.from({length:H},()=>Array(W).fill(''));bag=[];score=lines=0;level=1;drop=800;over=false;o.style.display='none';cur=take();next=take();upd()}function cells(p=cur){return p.pts.map(([x,y])=>[x+p.x,y+p.y])}function bad(p=cur){return cells(p).some(([x,y])=>x<0||x>=W||y>=H||(y>=0&&B[y][x]))}function rot(){let p={...cur,pts:cur.pts.map(([x,y])=>[1-y,x])};for(const dx of [0,-1,1,-2,2]){p.x=cur.x+dx;if(!bad(p)){cur=p;break}}}function move(dx,dy){cur.x+=dx;cur.y+=dy;if(bad()){cur.x-=dx;cur.y-=dy;if(dy)lock();return false}return true}function hard(){while(move(0,1))score+=2;upd()}function lock(){cells().forEach(([x,y])=>{if(y>=0)B[y][x]=cur.t});clear();cur=next;next=take();if(bad()){over=true;o.style.display='grid'}}function clear(){let k=0;B=B.filter(r=>r.some(v=>!v)||(++k&&false));while(B.length<H)B.unshift(Array(W).fill(''));if(k){lines+=k;score+=[0,100,300,500,800][k]*level;level=1+(lines/10|0);drop=Math.max(90,800-(level-1)*70)}upd()}function upd(){s.textContent=score;ln.textContent=lines;lv.textContent=level}addEventListener('keydown',e=>{if(over&&e.key==' ')return reset();if(e.key=='ArrowLeft')move(-1,0);if(e.key=='ArrowRight')move(1,0);if(e.key=='ArrowDown'){if(move(0,1))score++}if(e.key=='ArrowUp')rot();if(e.key==' '){e.preventDefault();hard()}});function loop(t){if(!over&&t-last>drop){last=t;move(0,1)}draw();requestAnimationFrame(loop)}function ghost(){let p={...cur,y:cur.y,pts:cur.pts};while(!bad(p))p.y++;p.y--;return p}function block(ctx,x,y,col,a=1){ctx.globalAlpha=a;ctx.fillStyle=col;ctx.fillRect(x*Z+1,y*Z+1,Z-2,Z-2);ctx.globalAlpha=1}function draw(){g.fillStyle='#111421';g.fillRect(0,0,300,600);B.forEach((r,y)=>r.forEach((v,x)=>v&&block(g,x,y,C[v])));cells(ghost()).forEach(([x,y])=>y>=0&&block(g,x,y,'#fff',.18));cells().forEach(([x,y])=>y>=0&&block(g,x,y,C[cur.t]));ng.fillStyle='#111421';ng.fillRect(0,0,120,120);next.pts.forEach(([x,y])=>block(ng,x,y,C[next.t]))}reset();loop(0);</script></body></html>
