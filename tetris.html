<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tetris</title>
<style>:root{--a:#5cf2ff}*{box-sizing:border-box}html{height:100%}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 20% -10%,color-mix(in srgb,var(--a),transparent 78%),transparent 34%),radial-gradient(circle at 88% 8%,rgba(255,255,255,.10),transparent 28%),linear-gradient(180deg,#101018,#090909 70%);color:#f8fbff;font-family:system-ui,"Segoe UI","SF Pro Display",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:clamp(12px,3vw,24px)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle,#000 0%,transparent 78%);animation:grid 14s linear infinite}body:after{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.14) 0 1px,transparent 2px);background-size:82px 82px;animation:stars 20s linear infinite;opacity:.28}@keyframes grid{to{transform:translateY(44px)}}@keyframes stars{to{transform:translate3d(-82px,82px,0)}}.top{position:relative;z-index:2;width:min(920px,100%);display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}.menu{min-height:44px;display:inline-flex;align-items:center;color:var(--a);text-decoration:none;font-weight:900;border:1px solid color-mix(in srgb,var(--a),transparent 20%);border-radius:999px;background:rgba(255,255,255,.07);padding:10px 14px;box-shadow:5px 5px 0 #000,0 0 28px color-mix(in srgb,var(--a),transparent 78%)}.hud{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.pill,button{font:inherit;font-weight:800;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));color:#fff;border:1px solid color-mix(in srgb,var(--a),white 12%);border-radius:14px;padding:10px 14px;box-shadow:5px 5px 0 #000,0 0 24px color-mix(in srgb,var(--a),transparent 82%);backdrop-filter:blur(14px)}.pill b{font-variant-numeric:tabular-nums;color:var(--a)}button{cursor:pointer;min-height:44px;transition:transform .18s,box-shadow .18s,filter .18s}button:hover,button:focus-visible,.menu:hover,.menu:focus-visible{outline:2px solid var(--a);outline-offset:3px;transform:translate(-2px,-3px);filter:brightness(1.12)}button:active{transform:translate(1px,1px)}h1{position:relative;z-index:1;margin:10px 0 2px;color:var(--a);font-size:clamp(2.1rem,7vw,4.6rem);letter-spacing:-.07em;text-shadow:0 0 26px color-mix(in srgb,var(--a),transparent 45%),7px 7px 0 #000}canvas,.board{position:relative;z-index:1;max-width:min(94vw,920px);height:auto;background:linear-gradient(180deg,rgba(17,20,33,.92),rgba(9,10,18,.96));border:1px solid color-mix(in srgb,var(--a),white 10%);border-radius:22px;box-shadow:14px 14px 0 #000,0 0 55px color-mix(in srgb,var(--a),transparent 72%),inset 0 0 36px rgba(255,255,255,.04);margin-top:14px;touch-action:none}.overlay,.start{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.72);display:none;place-items:center;text-align:center;padding:20px;backdrop-filter:blur(10px)}.start{display:grid}.card{width:min(520px,92vw);background:linear-gradient(145deg,rgba(28,32,49,.86),rgba(12,14,24,.92));border:1px solid color-mix(in srgb,var(--a),white 15%);border-radius:24px;padding:28px;box-shadow:16px 16px 0 #000,0 0 70px color-mix(in srgb,var(--a),transparent 68%);animation:pop .42s cubic-bezier(.2,.9,.2,1)}.card p{color:#b9c0d8;line-height:1.55}.art{width:112px;height:112px;margin:0 auto 12px;border-radius:30px;background:radial-gradient(circle at 35% 30%,#fff8,transparent 20%),linear-gradient(135deg,var(--a),transparent);box-shadow:0 0 48px color-mix(in srgb,var(--a),transparent 35%);animation:float 3s ease-in-out infinite}.sound{position:fixed;right:16px;bottom:16px;z-index:4}.shake{animation:shake .22s}.flash{animation:flash .32s}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(18px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes flash{50%{filter:brightness(1.8)}}@media(max-width:640px){.top{align-items:flex-start}.hud{font-size:.86rem}.pill,button,.menu{padding:9px 11px}canvas{width:94vw}.board{transform-origin:top center;max-width:94vw}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}.wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:center}</style>
</head>
<body>
<div class="start" id="start">
<div class="card">
<div class="art" aria-hidden="true">
</div>
<h2>Tetris</h2>
<p>Stack all seven tetrominoes, clear lines, and chase higher levels.</p>
<p>
<strong>Controls:</strong> ←/→ move, ↑ rotate, ↓ soft drop, Space hard drop.</p>
<p>
<strong>Mode:</strong> Marathon</p>
<button id="startBtn" type="button">Start Game</button>
</div>
</div>
<button class="sound" id="soundBtn" type="button" aria-label="Toggle sound">Sound On</button>
<div class=top>
<a class=menu href="index.html">‹ Menu</a>
<div class=hud>
<span class=pill>Score <b id=s>0</b>
</span>
<span class=pill>Lines <b id=ln>0</b>
</span>
<span class=pill>Level <b id=lv>1</b>
</span>
</div>
</div>
<h1>TETRIS</h1>
<div class=wrap>
<canvas id=c width=300 height=600>
</canvas>
<canvas id=n width=120 height=120>
</canvas>
</div>
<div class=overlay id=o>
<div class=card>
<h2>Game over</h2>
<button onclick="reset()">Restart</button>
</div>
</div>
<script>
// Premium shell: menu, generated UI sounds, and button feedback.
let __muted=false,__audio;function __beep(freq=440,dur=.06,type='sine'){if(__muted)return;__audio=__audio||new (window.AudioContext||window.webkitAudioContext)();const o=__audio.createOscillator(),gain=__audio.createGain();o.type=type;o.frequency.value=freq;gain.gain.setValueAtTime(.045,__audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,__audio.currentTime+dur);o.connect(gain);gain.connect(__audio.destination);o.start();o.stop(__audio.currentTime+dur)}addEventListener('click',e=>{if(e.target.closest('button,a'))__beep(520,.045,'triangle')},true);addEventListener('DOMContentLoaded',()=>{const st=document.getElementById('start'),sb=document.getElementById('startBtn'),snd=document.getElementById('soundBtn');if(sb)sb.onclick=()=>{__beep(760,.09,'square');st.style.display='none'};if(snd)snd.onclick=()=>{__muted=!__muted;snd.textContent=__muted?'Sound Off':'Sound On'}});

const c=document.getElementById('c'),g=c.getContext('2d'),ng=n.getContext('2d'),W=10,H=20,Z=30;let B,bag,cur,next,score,lines,level,last=0,drop=800,over=false;const P={I:[[0,1],[1,1],[2,1],[3,1]],O:[[1,0],[2,0],[1,1],[2,1]],T:[[1,0],[0,1],[1,1],[2,1]],S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]]},C={I:'#5cf2ff',O:'#ffd84c',T:'#b66cff',S:'#65ff65',Z:'#ff6b8b',J:'#4d7cff',L:'#ff9b4c'};function take(){if(!bag.length)bag=Object.keys(P).sort(()=>Math.random()-.5);let t=bag.pop();return{t,x:3,y:0,r:0,pts:P[t].map(p=>[...p])}}function reset(){B=Array.from({length:H},()=>Array(W).fill(''));bag=[];score=lines=0;level=1;drop=800;over=false;o.style.display='none';cur=take();next=take();upd()}function cells(p=cur){return p.pts.map(([x,y])=>[x+p.x,y+p.y])}function bad(p=cur){return cells(p).some(([x,y])=>x<0||x>=W||y>=H||(y>=0&&B[y][x]))}function rot(){let p={...cur,pts:cur.pts.map(([x,y])=>[1-y,x])};for(const dx of [0,-1,1,-2,2]){p.x=cur.x+dx;if(!bad(p)){cur=p;break}}}function move(dx,dy){cur.x+=dx;cur.y+=dy;if(bad()){cur.x-=dx;cur.y-=dy;if(dy)lock();return false}return true}function hard(){while(move(0,1))score+=2;upd()}function lock(){cells().forEach(([x,y])=>{if(y>=0)B[y][x]=cur.t});clear();cur=next;next=take();if(bad()){over=true;o.style.display='grid'}}function clear(){let k=0;B=B.filter(r=>r.some(v=>!v)||(++k&&false));while(B.length<H)B.unshift(Array(W).fill(''));if(k){lines+=k;score+=[0,100,300,500,800][k]*level;level=1+(lines/10|0);drop=Math.max(90,800-(level-1)*70)}upd()}function upd(){s.textContent=score;ln.textContent=lines;lv.textContent=level}addEventListener('keydown',e=>{if(over&&e.key==' ')return reset();if(e.key=='ArrowLeft')move(-1,0);if(e.key=='ArrowRight')move(1,0);if(e.key=='ArrowDown'){if(move(0,1))score++}if(e.key=='ArrowUp')rot();if(e.key==' '){e.preventDefault();hard()}});function loop(t){if(!over&&t-last>drop){last=t;move(0,1)}draw();requestAnimationFrame(loop)}function ghost(){let p={...cur,y:cur.y,pts:cur.pts};while(!bad(p))p.y++;p.y--;return p}function block(ctx,x,y,col,a=1){ctx.globalAlpha=a;ctx.fillStyle=col;ctx.fillRect(x*Z+1,y*Z+1,Z-2,Z-2);ctx.globalAlpha=1}function draw(){g.fillStyle='#111421';g.fillRect(0,0,300,600);B.forEach((r,y)=>r.forEach((v,x)=>v&&block(g,x,y,C[v])));cells(ghost()).forEach(([x,y])=>y>=0&&block(g,x,y,'#fff',.18));cells().forEach(([x,y])=>y>=0&&block(g,x,y,C[cur.t]));ng.fillStyle='#111421';ng.fillRect(0,0,120,120);next.pts.forEach(([x,y])=>block(ng,x,y,C[next.t]))}reset();loop(0);</script>
</body>
</html>
