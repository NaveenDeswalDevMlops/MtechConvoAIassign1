<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lunar Lander • Neon Arcade</title><style>
:root{--a:#d6f5ff;--bg:#060713;--panel:#12162a;--fg:#f8fbff;--muted:#a9b4d0}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--a) 28%,transparent),transparent 34%),radial-gradient(circle at 85% 100%,#6d28d944,transparent 35%),linear-gradient(135deg,#050611,#0b1022 60%,#050611);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body.hc{filter:contrast(1.25)}.wrap{height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:14px;gap:10px}.top,.hud,.controls{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}a,button,select,input{font:inherit}.menu,button,.pill,select,input{border:2px solid var(--a);border-radius:14px;background:#10162bcc;color:var(--fg);box-shadow:0 0 18px #0008,0 0 16px color-mix(in srgb,var(--a) 35%,transparent);padding:9px 12px}.menu{color:var(--a);text-decoration:none;font-weight:900}h1{margin:0;color:var(--a);letter-spacing:.08em;text-shadow:0 0 18px var(--a)}canvas{width:min(96vw,900px);height:min(62vh,560px);max-height:620px;align-self:center;justify-self:center;border:3px solid var(--a);border-radius:24px;background:#090d1c;box-shadow:12px 12px 0 #000, inset 0 0 80px #000a;touch-action:none}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#02030bd0;backdrop-filter:blur(10px);z-index:5}.card{width:min(560px,92vw);text-align:center;background:linear-gradient(160deg,#18203b,#090d1a);border:3px solid var(--a);border-radius:24px;padding:24px;box-shadow:14px 14px 0 #000,0 0 45px color-mix(in srgb,var(--a) 45%,transparent)}.card p{color:var(--muted);line-height:1.55}.hidden{display:none}.toast{position:fixed;top:76px;right:16px;background:#111a31;border:2px solid var(--a);border-radius:14px;padding:10px 14px;transform:translateX(130%);transition:.35s;z-index:7}.toast.show{transform:none}.mobile{justify-content:center}@media(max-width:700px){h1{font-size:1.25rem}canvas{height:58vh}.pill{font-size:.8rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><div class="wrap"><div class="top"><a class="menu" href="index.html">‹ Menu</a><h1>Lunar Lander</h1><div class="hud"><span class="pill">Score <b id="score">0</b></span><span class="pill">Best <b id="best">0</b></span><span class="pill">Combo <b id="combo">0</b></span><button id="pauseBtn">Pause</button><button id="muteBtn">🔊</button></div></div><canvas id="game" width="900" height="560" aria-label="Lunar Lander game canvas"></canvas><div class="controls"><span class="pill">Arrows/Space thrust.</span><label class="pill">Volume <input id="vol" type="range" min="0" max="1" step=".05" value=".45"></label><label class="pill"><input id="contrast" type="checkbox"> High contrast</label></div></div><div id="menu" class="overlay"><div class="card"><h2>Lunar Lander</h2><p>Land gently on a glowing pad.</p><p><b>Controls:</b> Arrows/Space thrust.</p><button id="startBtn">Start Game</button> <button id="settingsBtn">Settings</button></div></div><div id="panel" class="overlay hidden"><div class="card"><h2>Settings</h2><p>Session-only stats, Web Audio beeps, reduced-motion support, keyboard and touch controls are built in.</p><button id="closeSettings">Back</button></div></div><div id="toast" class="toast">Achievement unlocked!</div><script>
const META={title:'Lunar Lander',mode:'lander',accent:'#d6f5ff',target:(220)};
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),comboEl=document.getElementById('combo'),toastEl=document.getElementById('toast');let W=900,H=560,playing=false,paused=false,over=false,won=false,score=0,best=0,combo=0,time=0,last=0,shake=0,particles=[],floaters=[],keys={},pointer={x:W/2,y:H/2,down:false},muted=false,vol=.45,stats={plays:0,wins:0,losses:0};let player={x:450,y:280,r:18,c:META.accent,vy:0},items=[],bullets=[],enemies=[],grid=[];
function resize(){const r=canvas.getBoundingClientRect();W=canvas.width=Math.max(600,Math.floor(r.width*devicePixelRatio));H=canvas.height=Math.max(360,Math.floor(r.height*devicePixelRatio));}addEventListener('resize',resize);resize();
function beep(f=440,d=.06,type='sine'){if(muted)return;try{const ac=beep.ac||(beep.ac=new AudioContext()),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol*.08;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function addPts(n,x=player?.x||W/2,y=player?.y||H/2){score+=n;best=Math.max(best,score);combo++;scoreEl.textContent=score;bestEl.textContent=best;comboEl.textContent=combo;floaters.push({x,y,t:0,v:'+'+n});if(combo&&combo%5==0)toast('Combo x'+combo);beep(520+n*2,.05,'square')}
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1200)}
function burst(x,y,c=META.accent,n=16){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*360,vy:(Math.random()-.5)*360,life:.5+Math.random()*.5,c})}
function reset(){stats.plays++;score=combo=time=0;over=won=false;playing=true;paused=false;particles=[];floaters=[];bullets=[];items=[];enemies=[];player={x:W*.5,y:H*.78,r:18,vx:0,vy:0,c:META.accent,on:false};for(let i=0;i<36;i++)items.push({x:40+Math.random()*(W-80),y:55+Math.random()*(H-140),r:10+Math.random()*12,c:['#ff4d6d','#5cf2ff','#ffd84c','#8cff66'][i%4],hit:false});for(let i=0;i<12;i++)enemies.push({x:50+i*(W-100)/12,y:70+Math.random()*90,r:18,vx:(i%2?1:-1)*(70+Math.random()*80),vy:25+Math.random()*35,h:2});scoreEl.textContent=bestEl.textContent=comboEl.textContent=0;menu.classList.add('hidden');toast('Ready!')}
function end(win=false){over=true;playing=false;won=win;stats[win?'wins':'losses']++;menu.querySelector('h2').textContent=win?'Victory!':'Game Over';menu.querySelector('p').innerHTML=`Final score <b>${score}</b><br>Session: ${stats.wins} wins / ${stats.losses} losses`;startBtn.textContent='Restart';menu.classList.remove('hidden');beep(win?880:130,.2,'sawtooth')}
function update(dt){if(!playing||paused)return;time+=dt;if(keys.p){paused=true;keys.p=false}let sp=360; if(keys.arrowleft||keys.a)player.x-=sp*dt;if(keys.arrowright||keys.d)player.x+=sp*dt;if(keys.arrowup||keys.w)player.y-=sp*dt;if(keys.arrowdown||keys.s)player.y+=sp*dt;if(pointer.down){player.x+=(pointer.x-player.x)*.12;player.y+=(pointer.y-player.y)*.12}player.x=Math.max(player.r,Math.min(W-player.r,player.x));player.y=Math.max(player.r,Math.min(H-player.r,player.y));
if((keys[' ']||keys.enter)&&time%0.12<dt){bullets.push({x:player.x,y:player.y-22,vx:0,vy:-620,r:5});beep(760,.035,'triangle')}
if(['flap','runner','jump','platform','lander','golf','pinball'].includes(META.mode)){player.vy+=650*dt;if(keys[' ']||keys.arrowup||keys.w||pointer.down)player.vy-=980*dt;player.y+=player.vy*dt;if(player.y>H-35){player.y=H-35;player.vy=-360;addPts(1,player.x,player.y)}}
items.forEach(it=>{if(it.hit)return;it.y+=Math.sin(time*2+it.x)*10*dt;if(Math.hypot(player.x-it.x,player.y-it.y)<player.r+it.r){it.hit=true;addPts(10,it.x,it.y);burst(it.x,it.y,it.c);shake=8}});
enemies.forEach(e=>{e.x+=e.vx*dt;e.y+=Math.sin(time+e.x*.01)*28*dt;if(e.x<e.r||e.x>W-e.r)e.vx*=-1;if(Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r){combo=0;comboEl.textContent=0;shake=12;burst(player.x,player.y,'#fff',10);score=Math.max(0,score-5);scoreEl.textContent=score;beep(180,.08,'sawtooth')}});
bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;enemies.forEach(e=>{if(e.h>0&&Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){e.h--;b.y=-99;addPts(15,e.x,e.y);burst(e.x,e.y)}})});bullets=bullets.filter(b=>b.y>-20&&b.y<H+20);if(items.every(i=>i.hit)||score>=META.target)end(true);if(time>90)end(false)}
function draw(){ctx.save();ctx.clearRect(0,0,W,H);if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86}ctx.fillStyle='#071022';ctx.fillRect(0,0,W,H);ctx.strokeStyle=META.accent;ctx.globalAlpha=.18;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.globalAlpha=1;ctx.fillStyle=player.c;ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,7);ctx.fill();ctx.shadowColor=player.c;ctx.shadowBlur=18;ctx.fill();ctx.shadowBlur=0;items.forEach(it=>{if(!it.hit){ctx.fillStyle=it.c;ctx.beginPath();ctx.roundRect(it.x-it.r,it.y-it.r,it.r*2,it.r*2,6);ctx.fill()}});enemies.forEach(e=>{if(e.h>0){ctx.strokeStyle='#ff4d6d';ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.stroke();ctx.fillStyle='#ff4d6d55';ctx.fill()}});ctx.fillStyle='#fff';bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()});particles.forEach(p=>{ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,p.life);ctx.fillRect(p.x,p.y,4,4)});ctx.globalAlpha=1;floaters.forEach(f=>{ctx.fillStyle=META.accent;ctx.font='700 24px monospace';ctx.fillText(f.v,f.x,f.y-f.t*40)});ctx.restore()}
function step(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);floaters.forEach(f=>f.t+=dt);floaters=floaters.filter(f=>f.t<1);update(dt);draw();requestAnimationFrame(step)}requestAnimationFrame(step);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='r')reset();if(e.key.toLowerCase()==='p'){paused=!paused;toast(paused?'Paused':'Resumed')}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);canvas.addEventListener('pointerdown',e=>{pointer.down=true;move(e);canvas.setPointerCapture(e.pointerId);if(!playing)reset()});canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',()=>pointer.down=false);function move(e){let r=canvas.getBoundingClientRect();pointer.x=(e.clientX-r.left)*canvas.width/r.width;pointer.y=(e.clientY-r.top)*canvas.height/r.height}
startBtn.onclick=reset;pauseBtn.onclick=()=>{paused=!paused;toast(paused?'Paused':'Resumed')};muteBtn.onclick=()=>{muted=!muted;muteBtn.textContent=muted?'🔇':'🔊'};vol.oninput=e=>vol=+e.target.value;settingsBtn.onclick=()=>panel.classList.remove('hidden');closeSettings.onclick=()=>panel.classList.add('hidden');contrast.onchange=e=>document.body.classList.toggle('hc',e.target.checked);
</script></body></html>
