<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048</title><style>:root{--a:#ffd84c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b2140,#080910 60%);color:#f6f7ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;display:flex;flex-direction:column;align-items:center;padding:16px}.top{width:min(900px,100%);display:flex;justify-content:space-between;align-items:center;gap:10px}.menu{color:var(--a);text-decoration:none;font-weight:900}.hud{display:flex;gap:10px;flex-wrap:wrap}.pill,button{background:#151827;color:#fff;border:2px solid var(--a);border-radius:12px;padding:8px 12px;box-shadow:5px 5px 0 #000}canvas,.board{background:#111421;border:3px solid var(--a);border-radius:16px;box-shadow:10px 10px 0 #000;margin-top:14px;touch-action:none}.overlay{position:fixed;inset:0;background:#000b;display:none;place-items:center;text-align:center;padding:20px}.card{background:#151827;border:3px solid var(--a);border-radius:18px;padding:22px;box-shadow:10px 10px 0 #000}button{cursor:pointer;font:inherit}h1{color:var(--a);text-shadow:5px 5px #000}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}.board{display:grid;grid-template-columns:repeat(4,72px);gap:10px;padding:12px}.tile{height:72px;display:grid;place-items:center;border-radius:10px;background:#20243a;font-size:1.5rem;font-weight:900;color:#fff}.v2,.v4{color:#111;background:#ffd84c}.v8,.v16{background:#ff9b4c}.v32,.v64{background:#ff5c7a}.v128,.v256{background:#7c6cff}.v512,.v1024{background:#4dffbf;color:#111}.v2048{background:#fff;color:#111}</style></head><body><div class=top><a class=menu href="index.html">‹ Menu</a><div class=hud><span class=pill>Score <b id=s>0</b></span><span class=pill>Best <b id=b>0</b></span></div></div><h1>2048</h1><div class=board id=bd></div><div class=overlay id=o><div class=card><h2 id=m></h2><button onclick="o.style.display='none';won=true">Keep going</button> <button onclick="reset()">Restart</button></div></div><script>
let G,score,best=0,won=false;function reset(){G=Array(16).fill(0);score=0;won=false;o.style.display='none';add();add();draw()}function add(){let e=G.map((v,i)=>v?null:i).filter(v=>v!==null);if(e.length)G[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}function draw(){bd.innerHTML='';G.forEach(v=>{let d=document.createElement('div');d.className='tile '+(v?'v'+v:'');d.textContent=v||'';bd.appendChild(d)});s.textContent=score;b.textContent=best}function slide(vals){let a=vals.filter(Boolean),out=[];for(let i=0;i<a.length;i++){if(a[i]==a[i+1]){out.push(a[i]*2);score+=a[i]*2;i++}else out.push(a[i])}while(out.length<4)out.push(0);return out}function move(dir){let old=G.join();for(let i=0;i<4;i++){let idx=[0,1,2,3].map(j=>dir<2?i*4+j:j*4+i);let v=idx.map(k=>G[k]);if(dir==1||dir==3)v.reverse();v=slide(v);if(dir==1||dir==3)v.reverse();idx.forEach((k,n)=>G[k]=v[n])}if(G.join()!=old){add();best=Math.max(best,score);draw();if(G.includes(2048)&&!won){m.textContent='2048!';o.style.display='grid'}if(!can()){m.textContent='Game over';o.style.display='grid'}}}function can(){return G.includes(0)||G.some((v,i)=>(i%4<3&&v==G[i+1])||(i<12&&v==G[i+4]))}addEventListener('keydown',e=>{let k=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.key);if(k>-1){e.preventDefault();move(k)}});let sx,sy;bd.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};bd.ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:0):(dy>0?3:2))};reset();</script></body></html>
