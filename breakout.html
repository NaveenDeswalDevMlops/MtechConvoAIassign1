<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breakout</title><style>:root{--a:#ffbd45}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b2140,#080910 60%);color:#f6f7ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;display:flex;flex-direction:column;align-items:center;padding:16px}.top{width:min(900px,100%);display:flex;justify-content:space-between;align-items:center;gap:10px}.menu{color:var(--a);text-decoration:none;font-weight:900}.hud{display:flex;gap:10px;flex-wrap:wrap}.pill,button{background:#151827;color:#fff;border:2px solid var(--a);border-radius:12px;padding:8px 12px;box-shadow:5px 5px 0 #000}canvas,.board{background:#111421;border:3px solid var(--a);border-radius:16px;box-shadow:10px 10px 0 #000;margin-top:14px;touch-action:none}.overlay{position:fixed;inset:0;background:#000b;display:none;place-items:center;text-align:center;padding:20px}.card{background:#151827;border:3px solid var(--a);border-radius:18px;padding:22px;box-shadow:10px 10px 0 #000}button{cursor:pointer;font:inherit}h1{color:var(--a);text-shadow:5px 5px #000}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style></head><body><div class=top><a class=menu href="index.html">‹ Menu</a><div class=hud><span class=pill>Score <b id=s>0</b></span><span class=pill>Lives <b id=l>3</b></span></div></div><h1>BREAKOUT</h1><canvas id=c width=640 height=480></canvas><div class=overlay id=o><div class=card><h2 id=m></h2><button onclick="reset()">Restart</button></div></div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let pad,ball,bricks,score,lives,launched,over;function reset(){pad={x:270};ball={x:320,y:420,vx:4,vy:-4,r:8};score=0;lives=3;launched=false;over=false;o.style.display='none';bricks=[];for(let y=0;y<5;y++)for(let x=0;x<10;x++)bricks.push({x:20+x*60,y:50+y*26,w:50,h:18,on:1,co:`hsl(${30+y*35},90%,60%)`});s.textContent=0;l.textContent=3}function launch(){if(!launched&&!over)launched=true}addEventListener('keydown',e=>{if(e.key==' ')launch();if(e.key=='ArrowLeft')pad.x-=35;if(e.key=='ArrowRight')pad.x+=35;pad.x=Math.max(0,Math.min(540,pad.x))});c.onpointermove=e=>{let r=c.getBoundingClientRect();pad.x=(e.clientX-r.left)*640/r.width-50};c.onpointerdown=launch;function loop(){if(launched&&!over){ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<8||ball.x>632)ball.vx*=-1;if(ball.y<8)ball.vy*=-1;if(ball.y>500){if(--lives<1){end('Game over')}else{l.textContent=lives;launched=false;ball.x=pad.x+50;ball.y=420}}if(ball.y>440&&ball.x>pad.x&&ball.x<pad.x+100&&ball.vy>0){ball.vy=-Math.abs(ball.vy);ball.vx=(ball.x-(pad.x+50))/9}for(const b of bricks)if(b.on&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.on=0;ball.vy*=-1;s.textContent=++score;if(score==50)end('You cleared the wall!')}}else{ball.x=pad.x+50}draw();requestAnimationFrame(loop)}function end(t){over=true;m.textContent=t;o.style.display='grid'}function draw(){g.fillStyle='#111421';g.fillRect(0,0,640,480);for(const b of bricks)if(b.on){g.fillStyle=b.co;g.fillRect(b.x,b.y,b.w,b.h)}g.fillStyle='#fff';g.fillRect(pad.x,450,100,12);g.fillStyle='#ffbd45';g.beginPath();g.arc(ball.x,ball.y,ball.r,0,7);g.fill()}reset();loop();</script></body></html>
