<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tic Tac Toe</title>
<style>:root{--a:#ff6b8b}*{box-sizing:border-box}html{height:100%}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 20% -10%,color-mix(in srgb,var(--a),transparent 78%),transparent 34%),radial-gradient(circle at 88% 8%,rgba(255,255,255,.10),transparent 28%),linear-gradient(180deg,#101018,#090909 70%);color:#f8fbff;font-family:system-ui,"Segoe UI","SF Pro Display",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:clamp(12px,3vw,24px)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle,#000 0%,transparent 78%);animation:grid 14s linear infinite}body:after{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.14) 0 1px,transparent 2px);background-size:82px 82px;animation:stars 20s linear infinite;opacity:.28}@keyframes grid{to{transform:translateY(44px)}}@keyframes stars{to{transform:translate3d(-82px,82px,0)}}.top{position:relative;z-index:2;width:min(920px,100%);display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}.menu{min-height:44px;display:inline-flex;align-items:center;color:var(--a);text-decoration:none;font-weight:900;border:1px solid color-mix(in srgb,var(--a),transparent 20%);border-radius:999px;background:rgba(255,255,255,.07);padding:10px 14px;box-shadow:5px 5px 0 #000,0 0 28px color-mix(in srgb,var(--a),transparent 78%)}.hud{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.pill,button{font:inherit;font-weight:800;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));color:#fff;border:1px solid color-mix(in srgb,var(--a),white 12%);border-radius:14px;padding:10px 14px;box-shadow:5px 5px 0 #000,0 0 24px color-mix(in srgb,var(--a),transparent 82%);backdrop-filter:blur(14px)}.pill b{font-variant-numeric:tabular-nums;color:var(--a)}button{cursor:pointer;min-height:44px;transition:transform .18s,box-shadow .18s,filter .18s}button:hover,button:focus-visible,.menu:hover,.menu:focus-visible{outline:2px solid var(--a);outline-offset:3px;transform:translate(-2px,-3px);filter:brightness(1.12)}button:active{transform:translate(1px,1px)}h1{position:relative;z-index:1;margin:10px 0 2px;color:var(--a);font-size:clamp(2.1rem,7vw,4.6rem);letter-spacing:-.07em;text-shadow:0 0 26px color-mix(in srgb,var(--a),transparent 45%),7px 7px 0 #000}canvas,.board{position:relative;z-index:1;max-width:min(94vw,920px);height:auto;background:linear-gradient(180deg,rgba(17,20,33,.92),rgba(9,10,18,.96));border:1px solid color-mix(in srgb,var(--a),white 10%);border-radius:22px;box-shadow:14px 14px 0 #000,0 0 55px color-mix(in srgb,var(--a),transparent 72%),inset 0 0 36px rgba(255,255,255,.04);margin-top:14px;touch-action:none}.overlay,.start{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.72);display:none;place-items:center;text-align:center;padding:20px;backdrop-filter:blur(10px)}.start{display:grid}.card{width:min(520px,92vw);background:linear-gradient(145deg,rgba(28,32,49,.86),rgba(12,14,24,.92));border:1px solid color-mix(in srgb,var(--a),white 15%);border-radius:24px;padding:28px;box-shadow:16px 16px 0 #000,0 0 70px color-mix(in srgb,var(--a),transparent 68%);animation:pop .42s cubic-bezier(.2,.9,.2,1)}.card p{color:#b9c0d8;line-height:1.55}.art{width:112px;height:112px;margin:0 auto 12px;border-radius:30px;background:radial-gradient(circle at 35% 30%,#fff8,transparent 20%),linear-gradient(135deg,var(--a),transparent);box-shadow:0 0 48px color-mix(in srgb,var(--a),transparent 35%);animation:float 3s ease-in-out infinite}.sound{position:fixed;right:16px;bottom:16px;z-index:4}.shake{animation:shake .22s}.flash{animation:flash .32s}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(18px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes flash{50%{filter:brightness(1.8)}}@media(max-width:640px){.top{align-items:flex-start}.hud{font-size:.86rem}.pill,button,.menu{padding:9px 11px}canvas{width:94vw}.board{transform-origin:top center;max-width:94vw}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}.board{display:grid;grid-template-columns:repeat(3,96px);gap:10px;padding:12px}.cell{height:96px;font-size:3rem;border-radius:12px;background:#20243a;color:#fff;border:2px solid var(--a);box-shadow:5px 5px #000}.win{background:var(--a);color:#111}</style>
</head>
<body>
<div class="start" id="start">
<div class="card">
<div class="art" aria-hidden="true">
</div>
<h2>Tic Tac Toe</h2>
<p>Play X against an unbeatable minimax AI and fight for a draw.</p>
<p>
<strong>Controls:</strong> Click or tap a cell to place X.</p>
<p>
<strong>Mode:</strong> Expert AI</p>
<button id="startBtn" type="button">Start Game</button>
</div>
</div>
<button class="sound" id="soundBtn" type="button" aria-label="Toggle sound">Sound On</button>
<div class=top>
<a class=menu href="index.html">‹ Menu</a>
<div class=hud>
<span class=pill>W <b id=w>0</b>
</span>
<span class=pill>L <b id=l>0</b>
</span>
<span class=pill>T <b id=t>0</b>
</span>
<button onclick="round()">New round</button>
</div>
</div>
<h1>TIC TAC TOE</h1>
<p id=msg>Your move.</p>
<div class=board id=bd>
</div>
<script>
// Premium shell: menu, generated UI sounds, and button feedback.
let __muted=false,__audio;function __beep(freq=440,dur=.06,type='sine'){if(__muted)return;__audio=__audio||new (window.AudioContext||window.webkitAudioContext)();const o=__audio.createOscillator(),gain=__audio.createGain();o.type=type;o.frequency.value=freq;gain.gain.setValueAtTime(.045,__audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,__audio.currentTime+dur);o.connect(gain);gain.connect(__audio.destination);o.start();o.stop(__audio.currentTime+dur)}addEventListener('click',e=>{if(e.target.closest('button,a'))__beep(520,.045,'triangle')},true);addEventListener('DOMContentLoaded',()=>{const st=document.getElementById('start'),sb=document.getElementById('startBtn'),snd=document.getElementById('soundBtn');if(sb)sb.onclick=()=>{__beep(760,.09,'square');st.style.display='none'};if(snd)snd.onclick=()=>{__muted=!__muted;snd.textContent=__muted?'Sound Off':'Sound On'}});

let B,W=0,L=0,T=0,over=false;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function round(){B=Array(9).fill('');over=false;draw();msg.textContent='Your move.'}function draw(line=[]){bd.innerHTML='';B.forEach((v,i)=>{let b=document.createElement('button');b.className='cell '+(line.includes(i)?'win':'');b.textContent=v;b.onclick=()=>play(i);bd.appendChild(b)})}function res(){for(const a of wins)if(B[a[0]]&&a.every(i=>B[i]==B[a[0]]))return [B[a[0]],a];return B.includes('')?null:['D',[]]}function play(i){if(over||B[i])return;B[i]='X';let r=res();if(r)return end(r);let ai=best();B[ai]='O';r=res();if(r)end(r);else draw()}function end(r){over=true;draw(r[1]);if(r[0]=='X'){W++;msg.textContent='You win!'}else if(r[0]=='O'){L++;msg.textContent='AI wins.'}else{T++;msg.textContent='Draw.'}w.textContent=W;l.textContent=L;t.textContent=T}function best(){let bs=-9,bi=0;B.forEach((v,i)=>{if(!v){B[i]='O';let sc=mm(false);B[i]='';if(sc>bs){bs=sc;bi=i}}});return bi}function mm(max){let r=res();if(r)return r[0]=='O'?1:r[0]=='X'?-1:0;let val=max?-9:9;B.forEach((v,i)=>{if(!v){B[i]=max?'O':'X';let sc=mm(!max);B[i]='';val=max?Math.max(val,sc):Math.min(val,sc)}});return val}round();</script>
</body>
</html>
