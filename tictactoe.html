<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic Tac Toe</title><style>:root{--a:#ff6b8b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b2140,#080910 60%);color:#f6f7ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;display:flex;flex-direction:column;align-items:center;padding:16px}.top{width:min(900px,100%);display:flex;justify-content:space-between;align-items:center;gap:10px}.menu{color:var(--a);text-decoration:none;font-weight:900}.hud{display:flex;gap:10px;flex-wrap:wrap}.pill,button{background:#151827;color:#fff;border:2px solid var(--a);border-radius:12px;padding:8px 12px;box-shadow:5px 5px 0 #000}canvas,.board{background:#111421;border:3px solid var(--a);border-radius:16px;box-shadow:10px 10px 0 #000;margin-top:14px;touch-action:none}.overlay{position:fixed;inset:0;background:#000b;display:none;place-items:center;text-align:center;padding:20px}.card{background:#151827;border:3px solid var(--a);border-radius:18px;padding:22px;box-shadow:10px 10px 0 #000}button{cursor:pointer;font:inherit}h1{color:var(--a);text-shadow:5px 5px #000}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}.board{display:grid;grid-template-columns:repeat(3,96px);gap:10px;padding:12px}.cell{height:96px;font-size:3rem;border-radius:12px;background:#20243a;color:#fff;border:2px solid var(--a);box-shadow:5px 5px #000}.win{background:var(--a);color:#111}</style></head><body><div class=top><a class=menu href="index.html">‹ Menu</a><div class=hud><span class=pill>W <b id=w>0</b></span><span class=pill>L <b id=l>0</b></span><span class=pill>T <b id=t>0</b></span><button onclick="round()">New round</button></div></div><h1>TIC TAC TOE</h1><p id=msg>Your move.</p><div class=board id=bd></div><script>
let B,W=0,L=0,T=0,over=false;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function round(){B=Array(9).fill('');over=false;draw();msg.textContent='Your move.'}function draw(line=[]){bd.innerHTML='';B.forEach((v,i)=>{let b=document.createElement('button');b.className='cell '+(line.includes(i)?'win':'');b.textContent=v;b.onclick=()=>play(i);bd.appendChild(b)})}function res(){for(const a of wins)if(B[a[0]]&&a.every(i=>B[i]==B[a[0]]))return [B[a[0]],a];return B.includes('')?null:['D',[]]}function play(i){if(over||B[i])return;B[i]='X';let r=res();if(r)return end(r);let ai=best();B[ai]='O';r=res();if(r)end(r);else draw()}function end(r){over=true;draw(r[1]);if(r[0]=='X'){W++;msg.textContent='You win!'}else if(r[0]=='O'){L++;msg.textContent='AI wins.'}else{T++;msg.textContent='Draw.'}w.textContent=W;l.textContent=L;t.textContent=T}function best(){let bs=-9,bi=0;B.forEach((v,i)=>{if(!v){B[i]='O';let sc=mm(false);B[i]='';if(sc>bs){bs=sc;bi=i}}});return bi}function mm(max){let r=res();if(r)return r[0]=='O'?1:r[0]=='X'?-1:0;let val=max?-9:9;B.forEach((v,i)=>{if(!v){B[i]=max?'O':'X';let sc=mm(!max);B[i]='';val=max?Math.max(val,sc):Math.min(val,sc)}});return val}round();</script></body></html>
