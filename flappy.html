<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy</title><style>:root{--a:#7c6cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b2140,#080910 60%);color:#f6f7ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;display:flex;flex-direction:column;align-items:center;padding:16px}.top{width:min(900px,100%);display:flex;justify-content:space-between;align-items:center;gap:10px}.menu{color:var(--a);text-decoration:none;font-weight:900}.hud{display:flex;gap:10px;flex-wrap:wrap}.pill,button{background:#151827;color:#fff;border:2px solid var(--a);border-radius:12px;padding:8px 12px;box-shadow:5px 5px 0 #000}canvas,.board{background:#111421;border:3px solid var(--a);border-radius:16px;box-shadow:10px 10px 0 #000;margin-top:14px;touch-action:none}.overlay{position:fixed;inset:0;background:#000b;display:none;place-items:center;text-align:center;padding:20px}.card{background:#151827;border:3px solid var(--a);border-radius:18px;padding:22px;box-shadow:10px 10px 0 #000}button{cursor:pointer;font:inherit}h1{color:var(--a);text-shadow:5px 5px #000}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style></head><body><div class=top><a class=menu href="index.html">‹ Menu</a><div class=hud><span class=pill>Score <b id=s>0</b></span><span class=pill>Best <b id=b>0</b></span></div></div><h1>FLAPPY</h1><canvas id=c width=420 height=560></canvas><div class=overlay id=o><div class=card><h2>Crash!</h2><button onclick="reset()">Restart</button></div></div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let bird,pipes,score,best=0,dead;function reset(){bird={x:90,y:260,v:0};pipes=[];score=0;dead=false;o.style.display='none';s.textContent=0}function flap(){if(dead)reset();bird.v=-8}addEventListener('keydown',e=>{if([' ','ArrowUp'].includes(e.key)){e.preventDefault();flap()}});c.onpointerdown=flap;function loop(){if(!dead){bird.v+=.45;bird.y+=bird.v;if(!pipes.length||pipes[pipes.length-1].x<230)pipes.push({x:430,g:120+Math.random()*250,pass:0});pipes.forEach(p=>p.x-=2.6);pipes=pipes.filter(p=>p.x>-70);if(bird.y<0||bird.y>535)die();for(const p of pipes){if(!p.pass&&p.x<bird.x){p.pass=1;score++;best=Math.max(best,score);s.textContent=score;b.textContent=best}if(bird.x+14>p.x&&bird.x-14<p.x+55&&(bird.y-14<p.g-75||bird.y+14>p.g+75))die()}}draw();requestAnimationFrame(loop)}function die(){dead=true;o.style.display='grid'}function draw(){g.fillStyle='#111421';g.fillRect(0,0,420,560);g.fillStyle='#4dffbf';for(const p of pipes){g.fillRect(p.x,0,55,p.g-75);g.fillRect(p.x,p.g+75,55,560)}g.fillStyle='#7c6cff';g.beginPath();g.arc(bird.x,bird.y,14,0,7);g.fill()}reset();loop();</script></body></html>
