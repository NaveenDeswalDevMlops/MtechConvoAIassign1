<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory</title><style>:root{--a:#b6ff4d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b2140,#080910 60%);color:#f6f7ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;display:flex;flex-direction:column;align-items:center;padding:16px}.top{width:min(900px,100%);display:flex;justify-content:space-between;align-items:center;gap:10px}.menu{color:var(--a);text-decoration:none;font-weight:900}.hud{display:flex;gap:10px;flex-wrap:wrap}.pill,button{background:#151827;color:#fff;border:2px solid var(--a);border-radius:12px;padding:8px 12px;box-shadow:5px 5px 0 #000}canvas,.board{background:#111421;border:3px solid var(--a);border-radius:16px;box-shadow:10px 10px 0 #000;margin-top:14px;touch-action:none}.overlay{position:fixed;inset:0;background:#000b;display:none;place-items:center;text-align:center;padding:20px}.card{background:#151827;border:3px solid var(--a);border-radius:18px;padding:22px;box-shadow:10px 10px 0 #000}button{cursor:pointer;font:inherit}h1{color:var(--a);text-shadow:5px 5px #000}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}.board{display:grid;grid-template-columns:repeat(4,78px);gap:12px;padding:14px}.cell{height:78px;border-radius:12px;border:2px solid var(--a);background:#20243a;color:#111;font-size:2rem;display:grid;place-items:center;box-shadow:5px 5px #000;cursor:pointer}.open,.hit{background:var(--a)}</style></head><body><div class=top><a class=menu href="index.html">‹ Menu</a><div class=hud><span class=pill>Moves <b id=mv>0</b></span><button onclick="reset()">Restart</button></div></div><h1>MEMORY</h1><div class=board id=bd></div><div class=overlay id=o><div class=card><h2>You matched them all!</h2><button onclick="reset()">Restart</button></div></div><script>
let vals,open=[],lock=false,moves=0,found=0;function reset(){vals=['◆','●','▲','■','★','☂','☀','☕'].flatMap(x=>[x,x]).sort(()=>Math.random()-.5);bd.innerHTML='';open=[];moves=found=0;mv.textContent=0;o.style.display='none';vals.forEach((v,i)=>{let d=document.createElement('button');d.className='cell';d.onclick=()=>flip(i,d);bd.appendChild(d)})}function flip(i,d){if(lock||d.classList.contains('open')||d.classList.contains('hit'))return;d.textContent=vals[i];d.classList.add('open');open.push([i,d]);if(open.length==2){moves++;mv.textContent=moves;let[a,b]=open;if(vals[a[0]]==vals[b[0]]){a[1].classList.add('hit');b[1].classList.add('hit');open=[];if(++found==8)o.style.display='grid'}else{lock=true;setTimeout(()=>{for(const[,e]of open){e.textContent='';e.classList.remove('open')}open=[];lock=false},650)}}}reset();</script></body></html>
