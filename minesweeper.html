<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minesweeper</title><style>:root{--a:#4dffbf}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b2140,#080910 60%);color:#f6f7ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;display:flex;flex-direction:column;align-items:center;padding:16px}.top{width:min(900px,100%);display:flex;justify-content:space-between;align-items:center;gap:10px}.menu{color:var(--a);text-decoration:none;font-weight:900}.hud{display:flex;gap:10px;flex-wrap:wrap}.pill,button{background:#151827;color:#fff;border:2px solid var(--a);border-radius:12px;padding:8px 12px;box-shadow:5px 5px 0 #000}canvas,.board{background:#111421;border:3px solid var(--a);border-radius:16px;box-shadow:10px 10px 0 #000;margin-top:14px;touch-action:none}.overlay{position:fixed;inset:0;background:#000b;display:none;place-items:center;text-align:center;padding:20px}.card{background:#151827;border:3px solid var(--a);border-radius:18px;padding:22px;box-shadow:10px 10px 0 #000}button{cursor:pointer;font:inherit}h1{color:var(--a);text-shadow:5px 5px #000}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}.board{display:grid;grid-template-columns:repeat(9,38px);gap:4px;padding:10px}.cell{height:38px;border-radius:7px;border:1px solid #4dffbf;background:#20243a;color:#fff;font-weight:900}.rev{background:#0c0e18}.n1{color:#5cf2ff}.n2{color:#65ff65}.n3{color:#ff6b8b}.n4{color:#ffd84c}</style></head><body><div class=top><a class=menu href="index.html">‹ Menu</a><div class=hud><span class=pill>Mines <b id=mc>10</b></span><span class=pill>Time <b id=tm>0</b></span><button onclick="reset()">Restart</button></div></div><h1>MINESWEEPER</h1><div class=board id=bd></div><div class=overlay id=o><div class=card><h2 id=m></h2><button onclick="reset()">Restart</button></div></div><script>
let G,first,flags,rev,dead,time,timer;function reset(){clearInterval(timer);G=Array.from({length:81},()=>({m:0,n:0,r:0,f:0}));first=true;flags=rev=time=0;dead=false;tm.textContent=0;mc.textContent=10;o.style.display='none';draw()}function plant(safe){let spots=[...Array(81).keys()].filter(i=>i!=safe);for(let k=0;k<10;k++){let j=Math.random()*spots.length|0;G[spots.splice(j,1)[0]].m=1}G.forEach((c,i)=>c.n=nb(i).filter(j=>G[j].m).length);timer=setInterval(()=>tm.textContent=++time,1000)}function nb(i){let x=i%9,y=i/9|0,a=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let X=x+dx,Y=y+dy;if((dx||dy)&&X>=0&&Y>=0&&X<9&&Y<9)a.push(Y*9+X)}return a}function click(i){if(dead||G[i].f)return;if(first){first=false;plant(i)}open(i);draw();if(rev==71)end('You cleared it!')}function open(i){let c=G[i];if(c.r||c.f)return;c.r=1;rev++;if(c.m)return end('Boom!');if(!c.n)nb(i).forEach(open)}function flag(e,i){e.preventDefault();if(dead||G[i].r)return;G[i].f=!G[i].f;flags+=G[i].f?1:-1;mc.textContent=10-flags;draw()}function end(t){dead=true;clearInterval(timer);G.forEach(c=>{if(c.m)c.r=1});m.textContent=t;o.style.display='grid';draw()}function draw(){bd.innerHTML='';G.forEach((c,i)=>{let b=document.createElement('button');b.className='cell '+(c.r?'rev n'+c.n:'');b.textContent=c.r?(c.m?'✹':(c.n||'')):(c.f?'⚑':'');b.onclick=()=>click(i);b.oncontextmenu=e=>flag(e,i);bd.appendChild(b)})}reset();</script></body></html>
