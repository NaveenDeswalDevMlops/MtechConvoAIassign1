[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtech-transformer-summarization"
version = "0.1.0"
description = "From-scratch PyTorch Transformer summarizer for CNN/DailyMail."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "datasets>=2.18",
  "tokenizers>=0.15",
  "rouge-score>=0.1.2",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
