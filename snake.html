<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake</title><style>:root{--a:#65ff65}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b2140,#080910 60%);color:#f6f7ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;display:flex;flex-direction:column;align-items:center;padding:16px}.top{width:min(900px,100%);display:flex;justify-content:space-between;align-items:center;gap:10px}.menu{color:var(--a);text-decoration:none;font-weight:900}.hud{display:flex;gap:10px;flex-wrap:wrap}.pill,button{background:#151827;color:#fff;border:2px solid var(--a);border-radius:12px;padding:8px 12px;box-shadow:5px 5px 0 #000}canvas,.board{background:#111421;border:3px solid var(--a);border-radius:16px;box-shadow:10px 10px 0 #000;margin-top:14px;touch-action:none}.overlay{position:fixed;inset:0;background:#000b;display:none;place-items:center;text-align:center;padding:20px}.card{background:#151827;border:3px solid var(--a);border-radius:18px;padding:22px;box-shadow:10px 10px 0 #000}button{cursor:pointer;font:inherit}h1{color:var(--a);text-shadow:5px 5px #000}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style></head><body><div class=top><a class=menu href="index.html">‹ Menu</a><div class=hud><span class=pill>Score <b id=s>0</b></span><span class=pill>Best <b id=b>0</b></span></div></div><h1>SNAKE</h1><canvas id=c width=480 height=480></canvas><div class=overlay id=o><div class=card><h2 id=msg>Game Over</h2><button onclick="reset()">Restart</button></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=24,Z=20;let snake,dir,next,food,score,best=0,dead,tick,last=0;function reset(){snake=[{x:12,y:12}];dir={x:1,y:0};next=dir;score=0;tick=150;dead=false;food=spawn();o.style.display='none';s.textContent=0}function spawn(){let p;do{p={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(q=>q.x==p.x&&q.y==p.y));return p}function key(e){let k=e.key.toLowerCase(),d={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(k==' '&&dead)reset();if(d&&!(d[0]==-dir.x&&d[1]==-dir.y)){next={x:d[0],y:d[1]};e.preventDefault()}}addEventListener('keydown',key);function loop(t){if(t-last>tick&&!dead){last=t;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(q=>q.x==h.x&&q.y==h.y)){dead=true;o.style.display='grid'}snake.unshift(h);if(h.x==food.x&&h.y==food.y){score++;best=Math.max(best,score);s.textContent=score;b.textContent=best;tick=Math.max(65,150-score*4);food=spawn()}else snake.pop()}draw();requestAnimationFrame(loop)}function draw(){x.fillStyle='#111421';x.fillRect(0,0,480,480);x.fillStyle='#ff4d6d';x.fillRect(food.x*Z+3,food.y*Z+3,Z-6,Z-6);x.fillStyle='#65ff65';snake.forEach((p,i)=>{x.globalAlpha=i?0.82:1;x.fillRect(p.x*Z+2,p.y*Z+2,Z-4,Z-4)});x.globalAlpha=1}reset();loop(0);</script></body></html>
